<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Agency</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="glassmorphism">
        <h1>Welcome to Our Travel Agency</h1>
    </header>

    <section id="home" class="glassmorphism">
        <h2>Home</h2>
        <p>This is the home section of our travel agency.</p>
    </section>

    <section id="directions" class="glassmorphism">
        <h2>Picked Directions</h2>
        <ul id="direction-list"></ul>
    </section>

    <section id="specialist" class="glassmorphism">
        <h2>Travel Agency Specialist</h2>
        <p>This section showcases our travel agency specialists.</p>
    </section>

    <section id="map" class="glassmorphism">
        <h2>Map</h2>
        <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m8!1m3!1d2489.40567354038!2d-73.9878146!3d40.712784!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sus!4v1633027295958!5m2!1sen!2sus" width="100%" height="450px" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
    </section>

    <section id="transport" class="glassmorphism">
        <h2>Means of Transport</h2>
        <div id="autoscroll-transport"></div>
    </section>

    <footer class="glassmorphism">
        <p>&copy; 2023 Travel Agency. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
