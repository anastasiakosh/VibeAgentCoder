<!DOCTYPE html>                                                                
 <html lang="en">                                                               
 <head>                                                                         
     <meta charset="UTF-8">                                                     
     <meta name="viewport" content="width=device-width, initial-scale=1.0">     
     <title>Travel Agency</title>                                               
     <style>                                                                    
         body {                                                                 
             font-family: 'Arial', sans-serif;                                  
             margin: 0;                                                         
             padding: 0;                                                        
             background-color: #f4f4f4;                                         
         }                                                                      
         header {                                                               
             background: linear-gradient(135deg, #2d2d2d, #8b8b8b);             
             color: white;                                                      
             padding: 1rem 0;                                                   
             text-align: center;                                                
         }                                                                      
         .nav {                                                                 
             display: flex;                                                     
             justify-content: space-around;                                     
             background-color: #3a3a3a;                                         
             padding: 0.5rem 0;                                                 
         }                                                                      
         .nav a {                                                               
             color: white;                                                      
             text-decoration: none;                                             
             padding: 0.5rem 1rem;                                              
         }                                                                      
         .carousel-container {                                                  
             position: relative;                                                
             width: 80%;                                                        
             margin: 2rem auto;                                                 
         }                                                                      
         .carousel-slide {                                                      
             display: flex;                                                     
             transition: transform 0.5s ease-in-out;                            
         }                                                                      
         .carousel-slide img {                                                  
             min-width: 100%;                                                   
             height: auto;                                                      
         }                                                                      
         .nav-dots {                                                            
             text-align: center;                                                
             margin-top: 1rem;                                                  
         }                                                                      
         .dot {                                                                 
             display: inline-block;                                             
             width: 12px;                                                       
             height: 12px;                                                      
             border-radius: 50%;                                                
             background-color: rgba(255, 255, 255, 0.4);                        
             margin: 0 5px;                                                     
             cursor: pointer;                                                   
         }                                                                      
         .dot.active {                                                          
             background-color: white;                                           
         }                                                                      
         .booking-form {                                                        
             background-color: #fff;                                            
             padding: 2rem;                                                     
             border-radius: 8px;                                                
             box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);                          
             width: 80%;                                                        
             margin: 2rem auto;                                                 
         }                                                                      
         .form-group {                                                          
             margin-bottom: 1rem;                                               
         }                                                                      
         .form-group label {                                                    
             display: block;                                                    
             margin-bottom: 0.5rem;                                             
         }                                                                      
         .form-group input, .form-group select {                                
             width: 100%;                                                       
             padding: 0.75rem;                                                  
             border: 1px solid #ccc;                                            
             border-radius: 4px;                                                
         }                                                                      
         .form-group button {                                                   
             background-color: #2d2d2d;                                         
             color: white;                                                      
             border: none;                                                      
             padding: 0.75rem 1.5rem;                                           
             border-radius: 4px;                                                
             cursor: pointer;                                                   
         }                                                                      
         .form-group button:hover {                                             
             background-color: #8b8b8b;                                         
         }                                                                      
     </style>                                                                   
 </head>                                                                        
 <body>                                                                         
     <header>                                                                   
         <h1>Travel Agency</h1>                                                 
     </header>                                                                  
     <div class="nav">                                                          
         <a href="#home">Home</a>                                               
         <a href="#about">About</a>                                             
         <a href="#services">Services</a>                                       
         <a href="#contact">Contact</a>                                         
     </div>                                                                     
     <div class="carousel-container" id="carouselContainer">                    
         <div class="carousel-slide" id="carouselSlide">                        
             <img src="https://via.placeholder.com/800x400?text=Slide+1"        
 alt="Slide 1">                                                                 
             <img src="https://via.placeholder.com/800x400?text=Slide+2"        
 alt="Slide 2">                                                                 
             <img src="https://via.placeholder.com/800x400?text=Slide+3"        
 alt="Slide 3">                                                                 
         </div>                                                                 
         <div class="nav-dots" id="navDots">                                    
             <span class="dot active"></span>                                   
             <span class="dot"></span>                                          
             <span class="dot"></span>                                          
         </div>                                                                 
     </div>                                                                     
     <div class="booking-form" id="bookingForm">                                
         <h2>Book Your Trip</h2>                                                
         <form>                                                                 
             <div class="form-group">                                           
                 <label for="name">Name:</label>                                
                 <input type="text" id="name" name="name" required>             
             </div>                                                             
             <div class="form-group">                                           
                 <label for="email">Email:</label>                              
                 <input type="email" id="email" name="email" required>          
             </div>                                                             
             <div class="form-group">                                           
                 <label for="destination">Destination:</label>                  
                 <select id="destination" name="destination" required>          
                     <option value="">Select a destination</option>             
                     <option value="paris">Paris, France</option>               
                     <option value="tokyo">Tokyo, Japan</option>                
                     <option value="new-york">New York City, USA</option>       
                 </select>                                                      
             </div>                                                             
             <div class="form-group">                                           
                 <label for="date">Date:</label>                                
                 <input type="date" id="date" name="date" required>             
             </div>                                                             
             <div class="form-group">                                           
                 <button type="submit">Book Now</button>                        
             </div>                                                             
         </form>                                                                
     </div>                                                                     
                                                                                
     <script>                                                                   
         const carouselContainer =                                              
 document.getElementById('carouselContainer');                                  
         const carouselSlide = document.getElementById('carouselSlide');        
         const navDots = document.querySelectorAll('.dot');                     
         let slideIndex = 0;                                                    
                                                                                
         function showSlides() {                                                
             slideIndex++;                                                      
             if (slideIndex > carouselSlide.children.length) { slideIndex = 1 } 
             for (let i = 0; i < carouselSlide.children.length; i++) {          
                 carouselSlide.children[i].style.display = "none";              
             }                                                                  
             for (let i = 0; i < navDots.length; i++) {                         
                 navDots[i].classList.remove('active');                         
             }                                                                  
             carouselSlide.children[slideIndex - 1].style.display = "block";    
             navDots[slideIndex - 1].classList.add('active');                   
         }                                                                      
                                                                                
         setInterval(showSlides, 3000);                                         
                                                                                
         navDots.forEach(dot => {                                               
             dot.addEventListener('click', () => {                              
                 slideIndex = Array.from(navDots).indexOf(dot) + 1;             
                 for (let i = 0; i < carouselSlide.children.length; i++) {      
                     carouselSlide.children[i].style.display = "none";          
                     navDots[i].classList.remove('active');                     
                 }                                                              
                 carouselSlide.children[slideIndex - 1].style.display =         
 "block";                                                                       
                 dot.classList.add('active');                                   
             });                                                                
         });                                                                    
                                                                                
         document.querySelector('#bookingForm form').addEventListener('submit', 
 (e) => {                                                                       
             e.preventDefault();                                                
             alert('Your trip has been booked!');                               
             document.querySelector('#bookingForm form').reset();               
         });                                                                    
     </script>                                                                  
 </body>                                                                        
 </html>
